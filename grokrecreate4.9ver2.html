<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VISTA Access - Page One</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border: 2px solid #333;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }
    .popup button {
      margin: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }
    .wallet-status {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .wallet-status span {
      font-weight: bold;
    }
    .welcome-message {
      margin-top: 20px;
      font-size: 1.2em;
      color: #333;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>VISTA Access Portal</h1>
  <div class="wallet-status">
    <span id="walletStatus">Not Connected</span>
    <button onclick="showPopup()">Connect Wallet</button>
  </div>
  <div id="welcomeMessage" class="welcome-message" style="display: none;"></div>
  <div id="walletPopup" class="popup">
    <h2>Connect Phantom Wallet</h2>
    <p>Please connect your Phantom Wallet to proceed.</p>
    <button onclick="connectWallet()">Connect</button>
    <button onclick="closePopup()">Cancel</button>
  </div>

  <script src="https://unpkg.com/@solana/web3.js@1.95.3/dist/index.min.js"></script>
  <script>
    // Show popup on page load
    window.onload = () => {
      console.log('Page loaded, showing popup');
      document.getElementById('walletPopup').style.display = 'block';
    };

    // Show popup manually
    function showPopup() {
      console.log('Connect Wallet button clicked, showing popup');
      document.getElementById('walletPopup').style.display = 'block';
    }

    // Close popup and update status to "Not Connected"
    function closePopup() {
      console.log('Cancel button clicked, closing popup');
      document.getElementById('walletPopup').style.display = 'none';
      document.getElementById('walletStatus').textContent = 'Not Connected';
      document.getElementById('welcomeMessage').style.display = 'none';
    }

    // Connect to Phantom Wallet
    async function connectWallet() {
      console.log('Connect button clicked, attempting to connect to Phantom');
      try {
        const { solana } = window;
        if (!solana || !solana.isPhantom) {
          console.error('Phantom Wallet extension not detected');
          alert('Please install Phantom Wallet extension.');
          closePopup();
          return;
        }
        // Disconnect any existing session to force wallet selection UI
        console.log('Disconnecting any existing Phantom session');
        await solana.disconnect();
        // Trigger Phantom wallet selection/login UI
        console.log('Requesting new connection');
        const response = await solana.connect();
        const publicKey = response.publicKey.toString();
        console.log('Connected to wallet:', publicKey);
        const shortAddress = publicKey.slice(0, 4) + '...' + publicKey.slice(-4);
        // Update wallet status
        document.getElementById('walletStatus').textContent = `Connected: ${shortAddress}`;
        // Show welcome message
        const userName = 'Guest'; // Replace with wallet metadata or backend query if available
        document.getElementById('welcomeMessage').textContent = 
          `Welcome ${userName}, do you have any $VISTA coin or do you need to buy!`;
        document.getElementById('welcomeMessage').style.display = 'block';
        // Close popup
        document.getElementById('walletPopup').style.display = 'none';
      } catch (error) {
        console.error('Wallet connection failed:', error);
        alert('Failed to connect wallet. Please try again.');
        closePopup();
      }
    }
  </script>
</body>
</html>
